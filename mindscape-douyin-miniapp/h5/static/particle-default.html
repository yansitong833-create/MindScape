<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>MindScape 粒子云 Demo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #f9f6f0; }
    canvas { display: block; width: 100%; height: 100%; }
    .badge {
      position: fixed; left: 12px; bottom: 12px;
      font: 12px/1.4 -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif;
      color: rgba(29, 33, 41, 0.45); pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div class="badge">静态演示 · 预生成 HTML</div>
  <script>
    (function () {
      var canvas = document.getElementById('c');
      var ctx = canvas.getContext('2d');
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      var W = 0, H = 0, pts = [], t0 = Date.now();

      function resize() {
        W = window.innerWidth;
        H = window.innerHeight;
        canvas.width = Math.floor(W * dpr);
        canvas.height = Math.floor(H * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      function seed(n) {
        var arr = [];
        for (var i = 0; i < n; i++) {
          var th = Math.random() * Math.PI * 2;
          var r = Math.sqrt(Math.random()) * 0.42;
          arr.push({
            tx: Math.cos(th) * r,
            ty: Math.sin(th) * r * 0.82,
            x: (Math.random() - 0.5) * 1.2,
            y: (Math.random() - 0.5) * 1.2,
            hue: 200 + Math.random() * 80,
            size: 1 + Math.random() * 2.2
          });
        }
        return arr;
      }

      pts = seed(1400);
      resize();
      window.addEventListener('resize', resize);

      function draw() {
        var t = (Date.now() - t0) * 0.001;
        ctx.clearRect(0, 0, W, H);
        var cx = W * 0.5, cy = H * 0.5;
        var ease = Math.min(1, t / 2.2);
        var sway = 0.03;

        for (var i = 0; i < pts.length; i++) {
          var p = pts[i];
          var tx = p.tx + Math.sin(t * 0.4 + p.ty * 3) * sway;
          var ty = p.ty + Math.cos(t * 0.35 + p.tx * 3) * sway;
          p.x += (tx - p.x) * 0.04;
          p.y += (ty - p.y) * 0.04;
          var px = cx + p.x * Math.min(W, H) * 0.88 * ease;
          var py = cy - p.y * Math.min(W, H) * 0.88 * ease;
          var a = 0.35 + ease * 0.45;
          ctx.beginPath();
          ctx.fillStyle = 'hsla(' + p.hue + ',42%,58%,' + (a * 0.25) + ')';
          ctx.arc(px, py, p.size * 3.2, 0, Math.PI * 2);
          ctx.fill();
          ctx.beginPath();
          ctx.fillStyle = 'hsla(' + p.hue + ',48%,42%,' + a + ')';
          ctx.arc(px, py, p.size, 0, Math.PI * 2);
          ctx.fill();
        }
        requestAnimationFrame(draw);
      }
      draw();
    })();
  </script>
</body>
</html>
