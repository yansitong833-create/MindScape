<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="format-detection" content="telephone=no,address=no" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <title>MindScape</title>
    <!-- 虚拟创作 zip / 本地静态服：相对路径资源 + hash 路由首页（须在应用脚本前执行） -->
    <script type="text/javascript">
      (function () {
        try {
          var p = location.pathname || '/';
          var dir = p.endsWith('/') ? p : p.replace(/\/[^/]*$/, '/');
          if (!dir) dir = './';
          window.__webpack_public_path__ = dir;
        } catch (e) {}
        var home = '#/pages/diary/index';
        var hash = location.hash || '';
        if (!hash || hash === '#' || hash === '#/') {
          location.replace((location.pathname || '/') + (location.search || '') + home);
        }
      })();
    </script>
    <style>
      html,
      body,
      #app {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #f9f6f0;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="text/javascript"><%= htmlWebpackPlugin.options.script %></script>
    <script type="text/javascript">
      (function () {
        var cap = 22;
        var floor = 17;
        function clampRem() {
          var el = document.documentElement;
          var n = parseFloat(el.style.fontSize);
          if (!n || isNaN(n)) return;
          if (n > cap) el.style.fontSize = cap + 'px';
          else if (n < floor) el.style.fontSize = floor + 'px';
        }
        window.addEventListener('resize', clampRem);
        setTimeout(clampRem, 0);
        setTimeout(clampRem, 100);
      })();
    </script>
  </body>
</html>
