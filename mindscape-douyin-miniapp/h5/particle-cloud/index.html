<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
    />
    <title>MindScape Particle Cloud</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #f9f6f0;
      }
      #wrap {
        width: 100%;
        height: 100%;
        position: relative;
      }
      canvas {
        width: 100%;
        height: 100%;
        display: block;
      }
      #err {
        display: none;
        position: absolute;
        inset: 0;
        padding: 24px;
        box-sizing: border-box;
        align-items: center;
        justify-content: center;
        text-align: center;
        font: 14px/1.6 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        color: #4e5969;
        background: #f9f6f0;
      }
      #err.show {
        display: flex;
        flex-direction: column;
      }
    </style>
    <script src="libs/three.min.js"></script>
    <script src="libs/gsap.min.js"></script>
  </head>
  <body>
    <div id="wrap">
      <canvas id="c"></canvas>
    </div>
    <div id="err"></div>
    <script src="main.js"></script>
  </body>
</html>
