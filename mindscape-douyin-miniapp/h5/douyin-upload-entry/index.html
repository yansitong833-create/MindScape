<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="format-detection" content="telephone=no,address=no" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <title>MindScape · 抖音小程序</title>
    <style>
      :root {
        color-scheme: light;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background: #f9f6f0;
        color: #1d2129;
        font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei',
          'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
      .wrap {
        max-width: 720px;
        margin: 0 auto;
        padding: 28px 20px 40px;
      }
      .card {
        background: rgba(255, 255, 255, 0.92);
        border: 1px solid rgba(0, 0, 0, 0.06);
        border-radius: 14px;
        padding: 18px 16px;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 10px;
        font-weight: 600;
      }
      p {
        font-size: 14px;
        line-height: 1.7;
        margin: 8px 0;
        color: rgba(29, 33, 41, 0.78);
      }
      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono',
          'Courier New', monospace;
        font-size: 12px;
        background: rgba(29, 33, 41, 0.06);
        padding: 2px 6px;
        border-radius: 6px;
      }
      ul {
        margin: 8px 0;
        padding-left: 1.2em;
        color: rgba(29, 33, 41, 0.78);
        font-size: 14px;
        line-height: 1.7;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <h1>MindScape 抖音小程序构筑产物</h1>
        <p>
          本 ZIP 为抖音开放平台可识别的代码包。平台要求根目录包含 <code>index.html</code> 作为 Web
          入口标记；小程序实际运行入口由 <code>app.json</code> 中的 <code>pages</code> 定义。
        </p>
        <ul>
          <li>首屏页面：<code>pages/diary/index</code>（见 <code>app.json</code> 第一项）</li>
          <li>项目配置：<code>project.config.json</code></li>
        </ul>
        <p>请在抖音开发者工具中导入本目录，或使用 <code>tma upload</code> 上传后预览与提审。</p>
      </div>
    </div>
  </body>
</html>
